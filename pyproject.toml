[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-radar"
version = "0.1.0"
description = "Observatorio local de investigación con arXiv y Ollama"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
paper-radar = "radar.__main__:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
